<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traductor LSA (Tiempo Real)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f5f5f5;
        }

        /* HEADER VERDE */
        header {
            background-color: #00683e;
            color: white;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 60px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
            font-size: 15px;
        }

        .logo-center {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }
        
        .logo-center img {
            height: 45px;
        }

        /* CONTENEDOR PRINCIPAL */
        .main-container {
            display: flex;
            justify-content: center;
            padding: 30px 40px;
            gap: 30px;
            height: calc(100vh - 60px);
            overflow-y: auto;
            align-items: flex-start;
        }

        /* CONTENEDOR DE TODO EL CONTENIDO CENTRADO */
        .content-wrapper {
            display: flex;
            gap: 30px;
            max-width: 1600px;
            width: 100%;
        }

        /* COLUMNA IZQUIERDA */
        .left-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 940px;
        }

        h1 {
            color: #00683e;
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* VIDEO BOX */
        .video-container {
            width: 100%;
            background: black;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 15px;
            position: relative;
            aspect-ratio: 16/9;
        }

        #video-stream {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* ESTADÍSTICAS DEBAJO DEL VIDEO */
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 60px;
            margin-bottom: 20px;
            font-size: 14px;
            font-weight: 500;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #333;
        }

        /* BOTONES */
        .button-row {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .btn {
            padding: 11px 26px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.1s, opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-espacio {
            background-color: #5D87FF;
            color: white;
        }

        .btn-mejorar {
            background-color: #13DEB9;
            color: white;
        }

        .btn-limpiar {
            background-color: #FA896B;
            color: white;
        }

        /* CAJAS DE TEXTO */
        .output-section {
            margin-bottom: 20px;
        }

        .output-label {
            font-weight: 600;
            font-size: 14px;
            color: #1f2937;
            margin-bottom: 8px;
            display: block;
        }

        .output-box {
            width: 100%;
            padding: 16px 18px;
            border-radius: 8px;
            font-size: 15px;
            min-height: 55px;
            border: 1px solid #ddd;
            line-height: 1.5;
        }

        .output-primitive {
            background-color: #f5f5f5;
            color: #333;
        }

        .output-ia {
            background-color: #d1fae5;
            border-color: #a7f3d0;
            color: #064e3b;
        }

        /* HISTORIAL (DERECHA) - ALINEADO CON EL VIDEO */
        .history-sidebar {
            width: 380px;
            background-color: #e5e7eb;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            height: fit-content;
            border: 1px solid #d1d5db;
            flex-shrink: 0;
        }

        .history-header {
            padding: 16px 20px;
            font-weight: 700;
            font-size: 15px;
            color: #1f2937;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #d1d5db;
        }

        .history-content {
            padding: 15px;
            overflow-y: auto;
            max-height: 500px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .history-item {
            background: white;
            padding: 14px 16px;
            padding-right: 45px;
            border-radius: 8px;
            font-size: 14px;
            color: #374151;
            position: relative;
            line-height: 1.5;
            border: 1px solid #d1d5db;
        }

        .history-delete {
            position: absolute;
            right: 14px;
            top: 14px;
            cursor: pointer;
            color: #00683e;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .history-delete:hover {
            color: #004d2e;
        }

        .history-footer {
            padding: 14px;
            text-align: center;
            border-top: 1px solid #d1d5db;
            font-weight: 700;
            color: #00683e;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* RESPONSIVE */
        @media (max-width: 1400px) {
            .content-wrapper {
                flex-direction: column;
                align-items: center;
            }
            
            .history-sidebar {
                width: 100%;
                max-width: 940px;
            }
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <header>
        <div class="user-info">
            <i data-lucide="user" style="width: 22px; height: 22px;"></i>
            <span>Martiniano Meyorin</span>
        </div>
        
        <div class="logo-center">
            <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo" style="height: 40px;">
        </div>
        
        <div style="width: 150px;"></div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="main-container">
        <div class="content-wrapper">
            <!-- COLUMNA IZQUIERDA -->
            <div class="left-column">
                <h1>🤟 Traductor LSA (Tiempo Real)</h1>

                <!-- VIDEO -->
                <div class="video-container">
                    <img id="video-stream" src="{{ url_for('video_feed') }}" alt="Cámara">
                </div>

                <!-- ESTADÍSTICAS -->
                <div class="stats-bar">
                    <div class="stat-item">
                        👋 Manos: <strong id="manos-count">0</strong>
                    </div>
                    <div class="stat-item">
                        🎯 Confianza: <strong id="confianza-value">33%</strong>
                    </div>
                    <div class="stat-item">
                        📝 Última señal: <strong id="ultima-sena">-</strong>
                    </div>
                </div>

                <!-- BOTONES -->
                <div class="button-row">
                    <button class="btn btn-espacio" onclick="accion('espacio')">
                        Espacio
                    </button>
                    <button class="btn btn-mejorar" onclick="accion('mejorar')">
                        <i data-lucide="bot-message-square" style="width: 16px; height: 16px;"></i>
                        Mejorar con IA
                    </button>
                    <button class="btn btn-limpiar" onclick="accion('limpiar')">
                        <i data-lucide="trash-2" style="width: 16px; height: 16px;"></i>
                        Limpiar
                    </button>
                </div>

                <!-- ORACIÓN DETECTADA -->
                <div class="output-section">
                    <label class="output-label">Oración detectada:</label>
                    <div class="output-box output-primitive" id="oracion-detectada">
                        ...
                    </div>
                </div>

                <!-- TRADUCCIÓN IA -->
                <div class="output-section">
                    <label class="output-label">Traducción IA:</label>
                    <div class="output-box output-ia" id="traduccion-ia">
                        Esperando petición...
                    </div>
                </div>
            
            </div>

            <!-- HISTORIAL (DERECHA) -->
            <aside class="history-sidebar">
                <div class="history-header">
                    Historial de Mensajes
                    <i data-lucide="chevron-down" style="width: 20px; height: 20px;"></i>
                </div>
                
                <div class="history-content" id="history-list">
                    <div class="history-item">
                        Hola como estas?
                        <span class="history-delete" onclick="eliminarHistorial(0)">
                            <i data-lucide="trash-2" style="width: 18px; height: 18px;"></i>
                        </span>
                    </div>
                    <div class="history-item">
                        Ayer por la noche cocinamos un asado con mis amigos
                        <span class="history-delete" onclick="eliminarHistorial(1)">
                            <i data-lucide="trash-2" style="width: 18px; height: 18px;"></i>
                        </span>
                    </div>
                    <div class="history-item">
                        Mañana vamos a jugar un partido de futbol, te queres sumar? Vienen todos los chicos
                        <span class="history-delete" onclick="eliminarHistorial(2)">
                            <i data-lucide="trash-2" style="width: 18px; height: 18px;"></i>
                        </span>
                    </div>
                </div>

                <div class="history-footer">
                    <i data-lucide="chevrons-left" style="width: 16px; height: 16px;"></i>
                    <span>1</span>
                    <i data-lucide="chevrons-right" style="width: 16px; height: 16px;"></i>
                </div>
            </aside>
        </div>
    </div>

    <script>
        // Inicializar iconos de Lucide
        lucide.createIcons();

        // Actualizar datos desde el backend
        setInterval(async () => {
            try {
                const res = await fetch('/get_data');
                
                if (!res.ok) {
                    throw new Error(`HTTP error! status: ${res.status}`);
                }
                
                const data = await res.json();
                
                console.log('Datos recibidos:', data); // DEBUG

                // Actualizar stats
                document.getElementById('manos-count').innerText = data.manos || 0;
                document.getElementById('confianza-value').innerText = (data.confianza || 0) + '%';
                document.getElementById('ultima-sena').innerText = data.ultima_signo || '-';
                
                // Actualizar oración detectada
                const oracionRaw = data.oracion_raw || '...';
                document.getElementById('oracion-detectada').innerText = oracionRaw;
                
                // Actualizar traducción IA
                const iaBox = document.getElementById('traduccion-ia');
                if (data.estado_ia === 'cargando') {
                    iaBox.innerText = '⏳ Consultando a ChatGPT...';
                } else if (data.estado_ia === 'listo') {
                    iaBox.innerText = data.oracion_mejorada || 'Sin respuesta';
                } else {
                    iaBox.innerText = 'Esperando petición...';
                }
            } catch (e) {
                console.error('Error conectando con backend:', e);
                document.getElementById('oracion-detectada').innerText = 'Error de conexión';
            }
        }, 500);

        // Enviar acciones al backend
        async function accion(tipo) {
            try {
                await fetch('/accion', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ tipo: tipo })
                });
            } catch (e) {
                console.error('Error en acción:', e);
            }
        }

        // Eliminar elemento del historial
        function eliminarHistorial(index) {
            const items = document.querySelectorAll('.history-item');
            if (items[index]) {
                items[index].remove();
            }
        }
    </script>
</body>
</html>
