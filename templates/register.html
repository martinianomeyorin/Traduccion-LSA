<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Usuario - USAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #066C4D 0%, #066C4D 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .register-container { background: #e8e8e8; border-radius: 16px; padding: 50px 60px; width: 100%; max-width: 550px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3); }
        .logo-section { text-align: center; margin-bottom: 40px; }
        .logo-section img { height: 80px; margin-bottom: 10px; }
        h1 { color: #00683e; font-size: 1.8rem; font-weight: 700; text-align: center; margin-bottom: 40px; }
        .form-group { margin-bottom: 20px; }
        input { width: 100%; padding: 14px 16px; border: 1px solid #ccc; border-radius: 8px; font-size: 0.95rem; font-family: 'Inter', sans-serif; background: white; transition: border-color 0.3s; }
        input:focus { outline: none; border-color: #00683e; }
        .btn-register { width: 100%; padding: 15px; background-color: #00683e; color: white; border: none; border-radius: 8px; font-size: 1.05rem; font-weight: 600; cursor: pointer; margin-top: 10px; transition: background-color 0.3s; }
        .btn-register:hover { background-color: #004d2e; }
        .login-link { margin-top: 20px; text-align: center; }
        .login-link a { color: #00683e; font-weight: 600; text-decoration: underline; }
        @media (max-width: 600px) { .register-container { padding: 40px 30px; } h1 { font-size: 1.5rem; } }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="logo-section">
            <img src="../static/images/usal.png" alt="Logo USAL">
        </div>

        <h1>Crear Usuario</h1>

        <form id="registerForm">
            <div class="form-group">
                <input type="text" id="username" placeholder="Nombre de Usuario" required autocomplete="username">
            </div>

            <div class="form-group">
                <input type="email" id="email" placeholder="Correo electrónico" required autocomplete="email">
            </div>

            <div class="form-group">
                <input type="password" id="password" placeholder="Contraseña" required minlength="8" maxlength="128" autocomplete="new-password">
                <small style="color: #666; font-size: 0.8rem; margin-top: 5px; display: block;">
                    Entre 8 y 128 caracteres, con al menos una mayúscula y un carácter especial (por ejemplo, ! o #).
                </small>
            </div>

            <button type="submit" class="btn-register">Registrar</button>
        </form>

        <div class="login-link">
             ¿Ya tienes cuenta? <a href="/">Iniciar Sesión</a>
        </div>
    </div>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

    <script>
        function showNotification(message, type) {
            let bgColor;
            if (type === 'success') {
                bgColor = "linear-gradient(to right, #00b09b, #96c93d)"; // Verde brillante
            } else {
                bgColor = "linear-gradient(to right, #ff5f6d, #ffc371)"; // Rojo/Naranja error
            }

            Toastify({
                text: message,
                duration: 4000, 
                gravity: "top", 
                position: "right", 
                stopOnFocus: true, 
                style: {
                    background: bgColor,
                    borderRadius: "8px",
                    fontFamily: "'Inter', sans-serif"
                },
                onClick: function(){} 
            }).showToast();
        }

        function validarNuevaClave(password) {
            const cantidad = [...password].length;
            if (cantidad < 8) return 'La contraseña debe tener al menos 8 caracteres.';
            if (cantidad > 128) return 'La contraseña no puede superar los 128 caracteres.';
            if (!/\p{Lu}/u.test(password)) return 'La contraseña debe incluir al menos una mayúscula.';
            if (!/[^\p{L}\p{N}\s]/u.test(password)) return 'La contraseña debe incluir al menos un carácter especial (por ejemplo: ! o #).';
            return null;
        }

        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.querySelector('.btn-register');
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showNotification('El correo electrónico no es válido (debe contener "@").', 'error');
                return;
            }

            const errorClave = validarNuevaClave(password);
            if (errorClave) {
                showNotification(errorClave, 'error');
                return;
            }
            btn.disabled = true;
            btn.innerText = 'Registrando...';
            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });

                const data = await res.json();

                if (data.success) {
                    showNotification('¡Usuario registrado exitosamente! Redirigiendo...', 'success');
                    
                    setTimeout(() => {
                        window.location.href = '/'; 
                    }, 1500);
                    
                } else {
                    showNotification('Error: ' + data.message, 'error');
                }
            } catch (error) {
                console.error(error);
                showNotification('Error de conexión con el servidor.', 'error');
            } finally {
                btn.disabled = false;
                btn.innerText = 'Registrar';
            }
        });
    </script>
</body>
</html>
